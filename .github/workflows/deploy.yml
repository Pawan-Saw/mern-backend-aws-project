name: Deploy Backend to AWS EC2

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for syntax errors
        run: node --check src/server.js

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-24.04
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Validate EC2 host
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail

          if [ -z "$EC2_HOST" ]; then
            echo "::error::EC2_HOST secret is empty"
            exit 1
          fi

          if [[ "$EC2_HOST" == *"://"* || "$EC2_HOST" == *":"* ]]; then
            echo "::error::EC2_HOST must contain only a public IP address or hostname, no protocol or port"
            exit 1
          fi

          echo "Testing TCP connectivity to EC2 on port 22..."
          timeout 10 bash -c "</dev/tcp/$EC2_HOST/22" || {
            echo "::error::Cannot reach $EC2_HOST on TCP port 22. Check EC2 public IP, security group, route table, NACL, and ssh service."
            exit 1
          }

          echo "EC2 host is reachable on port 22."

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 10m

          script: |
            set -e

            echo "========================================="
            echo "DEPLOYMENT STARTED"
            echo "Time: $(date)"
            echo "========================================="

            APP_DIR="/var/www/backend"
            REPO_URL="https://github.com/${{ github.repository }}.git"
            BRANCH="main"

            echo "Checking required commands..."

            command -v git
            command -v node
            command -v npm
            command -v pm2

            echo "Node version:"
            node -v

            echo "NPM version:"
            npm -v

            echo "PM2 version:"
            pm2 -v

            echo "========================================="
            echo "Preparing application directory"
            echo "========================================="

            mkdir -p "$APP_DIR"

            if [ -d "$APP_DIR/.git" ]; then

              echo "Repository exists. Updating code..."

              cd "$APP_DIR"

              git fetch origin "$BRANCH"

              git reset --hard "origin/$BRANCH"

              # Preserve .env and logs
              git clean -fd -e .env -e logs/

            else

              echo "Repository does not exist. Cloning..."

              # Backup existing .env
              if [ -f "$APP_DIR/.env" ]; then
                cp "$APP_DIR/.env" /tmp/backend-env-backup
              fi

              rm -rf "$APP_DIR"/*

              git clone \
                --branch "$BRANCH" \
                --single-branch \
                "$REPO_URL" \
                "$APP_DIR"

              cd "$APP_DIR"

              # Restore .env
              if [ -f "/tmp/backend-env-backup" ]; then
                cp /tmp/backend-env-backup "$APP_DIR/.env"
                rm -f /tmp/backend-env-backup
              fi

            fi

            echo "========================================="
            echo "Checking required files"
            echo "========================================="

            test -f "$APP_DIR/package.json"
            test -f "$APP_DIR/package-lock.json"
            test -f "$APP_DIR/src/server.js"
            test -f "$APP_DIR/ecosystem.config.js"
            test -f "$APP_DIR/.env"

            echo "All required files found."

            echo "========================================="
            echo "Preparing logs directory"
            echo "========================================="

            mkdir -p "$APP_DIR/logs"

            touch "$APP_DIR/logs/output.log"
            touch "$APP_DIR/logs/error.log"

            chmod 664 "$APP_DIR/logs/output.log"
            chmod 664 "$APP_DIR/logs/error.log"

            echo "Logs directory:"
            ls -lah "$APP_DIR/logs"

            echo "========================================="
            echo "Installing dependencies"
            echo "========================================="

            cd "$APP_DIR"

            npm ci --omit=dev

            echo "========================================="
            echo "Checking PM2"
            echo "========================================="

            pm2 -v

            echo "========================================="
            echo "Restarting application"
            echo "========================================="

            if pm2 describe backend-api > /dev/null 2>&1; then

              echo "Existing PM2 application found."

              pm2 reload ecosystem.config.js --env production

            else

              echo "Starting PM2 application."

              pm2 start ecosystem.config.js --env production

            fi

            pm2 save

            echo "========================================="
            echo "PM2 STATUS"
            echo "========================================="

            pm2 status

            echo "========================================="
            echo "Waiting for application"
            echo "========================================="

            sleep 8

            echo "========================================="
            echo "Running health check"
            echo "========================================="

            HEALTH_URL="http://127.0.0.1:5000/api/health"

            HEALTH_OK=0

            for i in $(seq 1 10); do

              HTTP_STATUS=$(curl \
                -s \
                -o /tmp/backend-health.json \
                -w "%{http_code}" \
                --max-time 5 \
                "$HEALTH_URL" || true)

              echo "Health check attempt $i: HTTP $HTTP_STATUS"

              if [ "$HTTP_STATUS" = "200" ]; then

                echo "========================================="
                echo "HEALTH CHECK PASSED"
                echo "========================================="

                cat /tmp/backend-health.json

                HEALTH_OK=1

                break

              fi

              sleep 3

            done

            if [ "$HEALTH_OK" -ne 1 ]; then

              echo "========================================="
              echo "HEALTH CHECK FAILED"
              echo "========================================="

              echo "----- PM2 STATUS -----"
              pm2 status || true

              echo "----- PM2 DESCRIPTION -----"
              pm2 describe backend-api || true

              echo "----- PM2 LOGS -----"
              pm2 logs backend-api --lines 100 --nostream || true

              echo "----- PORT 5000 -----"
              sudo ss -lntp | grep :5000 || true

              echo "----- LOG DIRECTORY -----"
              ls -lah "$APP_DIR/logs" || true

              echo "----- OUTPUT LOG -----"
              cat "$APP_DIR/logs/output.log" || true

              echo "----- ERROR LOG -----"
              cat "$APP_DIR/logs/error.log" || true

              exit 1

            fi

            echo "========================================="
            echo "DEPLOYMENT SUCCESSFUL"
            echo "Time: $(date)"
            echo "========================================="
